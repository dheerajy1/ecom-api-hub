name: PR checks

on:
  pull_request:
    types: [opened]
    branches: [developer, staging, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------
  # 1. PR Semantic title
  # ---------------------------------------------
  title:
    name: title format
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------
  # 2. PR Auto labeler
  # ---------------------------------------------
  label:
    name: Auto label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

  # ---------------------------------------------
  # 3. PR check branch name
  # ---------------------------------------------
  branch-name:
    name: Branch name convention
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "[log] Head branch: $BRANCH"
          if [[ "$BRANCH" != feature/* && "$BRANCH" != developer && "$BRANCH" != patch-release-* && "$BRANCH" != staging && "$BRANCH" != main ]]; then
            echo "::error::Invalid branch name. Allowed patterns: feature/*, developer, staging, main"
            exit 1
          fi
          echo "::notice::Branch name valid: $BRANCH"

  # ---------------------------------------------
  # 4. PR check flow (source → target)
  # ---------------------------------------------
  pr-flow:
    name: flow validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate upstream flow
        run: |
          HEAD="${{ github.head_ref }}" 
          BASE="${{ github.base_ref }}"
          echo "[log] PR flow: $HEAD → $BASE"

          case "$BASE" in
            "main")
              if [[ "$HEAD" != "staging" ]]; then
                echo "::error::PRs to main must be from staging only (upward flow)"
                exit 1
              fi
              ;;
            "staging")
              if [[ "$HEAD" != "developer" && "$HEAD" != patch-release-* ]]; then
                echo "::error::PRs to staging must be from developer or patch-release-* only (upward flow)"
                exit 1
              fi
              ;;
            "developer")
              # Allow anything to developer (downstream syncs OK)
              ;;
            *)
              echo "::error::Invalid target branch: $BASE (only developer/staging/main allowed)"
              exit 1
              ;;
          esac
          echo "::notice::PR flow valid: $HEAD → $BASE"
