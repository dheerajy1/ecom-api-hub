<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Ecom Api hub</title>

    <!-- JetBrains Mono – clean monospace font -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <!-- Font Awesome for icons -->
    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>

    <style>
      :root {
        /* Grey monochrome theme – NO pure black anywhere except text */
        --color-bg: #e0e0e0;
        /* Light grey background */
        --color-surface: #f5f5f5;
        /* Very light grey card */
        --color-border: #bbbbbb;
        /* Medium grey borders */
        --color-border-thick: #999999;
        /* Darker grey for thick lines */
        --color-text-muted: #888888;
        /* Muted text */
        --color-text: #555555;
        /* Main secondary text */
        --color-text-primary: #000000;
        /* ONLY black here – for main text & mono style readability */
        --color-logo-bg: #ffffff;
        /* White logo background */
        --color-logo-text: #000000;
        /* Black logo text */
        --color-logo-border: #000000;
        /* Black logo border */
        --color-button-bg: #ffffff;
        /* White button */
        --color-button-text: #000000;
        /* Black button text */
        --color-button-hover: #dddddd;
        --color-button-active: #bbbbbb;
        --color-link: #333333;
        /* Dark grey link */
        --color-focus-border: #000000;
        /* Black border on focus */
        --border-thickness: 2px;
        --font: "JetBrains Mono", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font);
        background: var(--color-bg);
        color: var(--color-text-primary);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 1rem;
        line-height: 1.6;
      }

      .login-container {
        background: var(--color-surface);
        padding: 2rem;
        border: var(--border-thickness) solid var(--color-border-thick);
        width: 100%;
        max-width: 420px;
        text-align: left;
      }

      .header {
        text-align: center;
        margin-bottom: 1.5rem;
      }

      .logo {
        width: 60px;
        height: 60px;
        background: var(--color-logo-bg);
        color: var(--color-logo-text);
        margin: 0 auto 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: bold;
        border: var(--border-thickness) solid var(--color-logo-border);
      }

      h2 {
        font-size: 1.25rem;
        font-weight: 500;
        color: var(--color-text-primary);
        letter-spacing: 0.05em;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-top: 1.5rem;
      }

      .input-group {
        position: relative;
      }

      input {
        width: 100%;
        padding: 0.75rem 0.75rem 0.75rem 2.5rem;
        background: var(--color-bg);
        border: var(--border-thickness) solid var(--color-border);
        color: var(--color-text-primary);
        font-family: var(--font);
        font-size: 0.9rem;
      }

      input:focus {
        outline: none;
        border-color: var(--color-focus-border);
      }

      input::placeholder {
        color: var(--color-text-muted);
      }

      .icon {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--color-text-muted);
        font-size: 1rem;
        pointer-events: none;
      }

      button {
        width: 100%;
        padding: 0.75rem;
        background: var(--color-button-bg);
        color: var(--color-button-text);
        border: var(--border-thickness) solid var(--color-border-thick);
        font-family: var(--font);
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 0.5rem;
        letter-spacing: 0.05em;
        transition: all 0.15s ease;
      }

      button:hover {
        background: var(--color-button-hover);
      }

      button:active {
        background: var(--color-button-active);
        transform: scale(0.98);
      }

      .footer {
        margin-top: 1.5rem;
        text-align: center;
        color: var(--color-text-muted);
        font-size: 0.8rem;
      }

      footer {
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: var(--border-thickness) double var(--color-border-thick);
        text-align: center;
        color: var(--color-text-muted);
        font-size: 0.75rem;
      }

      footer p {
        margin: 0.25rem 0;
      }

      footer a {
        color: var(--color-link);
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }

      /* Tablet */
      @media (min-width: 481px) {
        .login-container {
          padding: 2.5rem;
        }

        .logo {
          width: 70px;
          height: 70px;
          font-size: 1.75rem;
        }

        h2 {
          font-size: 1.35rem;
        }

        input {
          font-size: 0.95rem;
        }

        button {
          font-size: 1rem;
        }
      }

      /* Desktop */
      @media (min-width: 769px) {
        body {
          padding: 2rem;
        }

        .login-container {
          padding: 3rem;
          max-width: 460px;
        }

        .logo {
          width: 80px;
          height: 80px;
          font-size: 2rem;
          margin-bottom: 1.2rem;
        }

        h2 {
          font-size: 1.5rem;
        }

        form {
          gap: 1.25rem;
          margin-top: 2rem;
        }

        input {
          padding: 0.85rem 0.85rem 0.85rem 2.75rem;
          font-size: 1rem;
        }

        .icon {
          left: 0.85rem;
          font-size: 1.1rem;
        }

        button {
          padding: 0.85rem;
          font-size: 1.05rem;
        }

        .footer {
          margin-top: 2rem;
          font-size: 0.85rem;
        }

        footer {
          margin-top: 2rem;
          padding-top: 1.25rem;
          font-size: 0.8rem;
        }
      }

      /* Small mobile */
      @media (max-width: 360px) {
        .login-container {
          padding: 1.5rem;
        }

        .logo {
          width: 50px;
          height: 50px;
          font-size: 1.25rem;
        }

        h2 {
          font-size: 1.1rem;
        }

        input {
          font-size: 0.85rem;
          padding: 0.7rem 0.7rem 0.7rem 2.25rem;
        }

        .icon {
          font-size: 0.9rem;
          left: 0.65rem;
        }

        button {
          font-size: 0.9rem;
          padding: 0.7rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="header">
        <div class="logo">ECOM</div>
        <h2>Ecom Server API Login</h2>
      </div>

      <form method="POST">
        <div class="input-group">
          <i class="fas fa-user icon"></i>
          <input name="username" placeholder="Username" required />
        </div>
        <div class="input-group">
          <i class="fas fa-lock icon"></i>
          <input
            name="password"
            type="password"
            placeholder="Password"
            required
          />
        </div>
        <button type="submit">Sign In</button>
      </form>

      <div class="footer">Secure access to portal / API documentation</div>

      <footer>
        <p>Developer: Dheeraj</p>
        <p>
          <a href="https://dheerajy1.hashnode.dev/">dheerajy1.hashnode.dev</a>
        </p>
      </footer>
    </div>
  </body>
</html>
